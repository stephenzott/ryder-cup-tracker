<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B1F3A" />
  <!-- Home Screen app support (see manifest.webmanifest): lets the site
       be added to a phone's Home Screen and open full-screen like an app,
       which iPhones require before they allow push notifications. -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Cup Tracker" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" />
  <title>Roster — Ryder Cup Trip</title>
  <link rel="stylesheet" href="css/style.css?v=14" />
</head>
<body>

  <!-- Navy page header (shared .page-header style). -->
  <header class="page-header">
    <p class="page-eyebrow" id="roster-eyebrow">This year's field</p>
    <h1 class="page-title">Roster</h1>
    <p class="page-sub">Teams are redrawn every year; these are this year's. Handicap Index is shown for reference only. It isn't used in match scoring yet.</p>
  </header>

  <!-- Players grouped by this year's team. Built by js/roster.js, which
       replaces these grey placeholder rows once the roster loads. -->
  <div id="roster-groups" aria-busy="true">
    <section class="roster-group">
      <ul class="roster-list">
        <li class="roster-row" aria-hidden="true"><span class="skeleton skeleton-avatar"></span><span class="skeleton skeleton-line skeleton-name"></span></li>
        <li class="roster-row" aria-hidden="true"><span class="skeleton skeleton-avatar"></span><span class="skeleton skeleton-line skeleton-name"></span></li>
        <li class="roster-row" aria-hidden="true"><span class="skeleton skeleton-avatar"></span><span class="skeleton skeleton-line skeleton-name"></span></li>
        <li class="roster-row" aria-hidden="true"><span class="skeleton skeleton-avatar"></span><span class="skeleton skeleton-line skeleton-name"></span></li>
      </ul>
    </section>
  </div>

  <p class="st-note">Organizers add players and set teams on the <a href="admin.html">Admin</a> page.</p>

  <script type="module" src="js/nav.js?v=4"></script>
  <script type="module" src="js/roster.js"></script>
</body>
</html>
