<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B1F3A" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" />
  <title>Roster — Ryder Cup Trip</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <h1>Roster</h1>
  <p>Handicap Index is shown for reference only — it isn't used in match scoring yet.</p>

  <table>
    <thead>
      <tr>
        <th>Player</th>
        <th>Handicap Index</th>
        <th>Team</th>
        <th id="roster-admin-col" style="display: none"></th>
      </tr>
    </thead>
    <tbody id="roster-rows">
      <tr><td colspan="4">Loading…</td></tr>
    </tbody>
  </table>

  <h2>Admin</h2>
  <p>Add, remove, or reassign players. Requires the admin code.</p>
  <div id="unlock"></div>

  <div id="admin-controls" class="locked">
    <h3>Add player</h3>
    <form id="add-player-form">
      <input type="text" id="new-player-name" placeholder="Player name" required />
      <input type="number" id="new-player-handicap" placeholder="Handicap index" step="0.1" />
      <select id="new-player-team">
        <option value="">Unassigned</option>
        <option value="A">United States</option>
        <option value="B">Europe</option>
      </select>
      <button type="submit">Add player</button>
      <span class="status-msg" id="add-player-status"></span>
    </form>
  </div>

  <script type="module" src="js/nav.js"></script>
  <script type="module" src="js/roster.js"></script>
</body>
</html>
