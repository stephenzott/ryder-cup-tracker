<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B1F3A" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" />
  <title>Roster — Ryder Cup Trip</title>
  <link rel="stylesheet" href="css/style.css?v=7" />
</head>
<body>

  <!-- Navy page header (shared .page-header style). -->
  <header class="page-header">
    <p class="page-eyebrow" id="roster-eyebrow">This year's field</p>
    <h1 class="page-title">Roster</h1>
    <p class="page-sub">Teams are redrawn every year; these are this year's. Handicap Index is shown for reference only. It isn't used in match scoring yet.</p>
  </header>

  <!-- Players grouped by this year's team. Built by js/roster.js, which
       replaces these grey placeholder rows once the roster loads. -->
  <div id="roster-groups" aria-busy="true">
    <section class="roster-group">
      <ul class="roster-list">
        <li class="roster-row" aria-hidden="true"><span class="skeleton skeleton-avatar"></span><span class="skeleton skeleton-line skeleton-name"></span></li>
        <li class="roster-row" aria-hidden="true"><span class="skeleton skeleton-avatar"></span><span class="skeleton skeleton-line skeleton-name"></span></li>
        <li class="roster-row" aria-hidden="true"><span class="skeleton skeleton-avatar"></span><span class="skeleton skeleton-line skeleton-name"></span></li>
        <li class="roster-row" aria-hidden="true"><span class="skeleton skeleton-avatar"></span><span class="skeleton skeleton-line skeleton-name"></span></li>
      </ul>
    </section>
  </div>

  <section class="roster-admin">
    <h2 class="section-title">Admin</h2>
    <p class="rd-help">Add, remove, or reassign players. Requires the admin code.</p>
    <div id="unlock"></div>

    <!-- "locked" fades this card and blocks taps until unlocked. -->
    <div id="admin-controls" class="locked roster-add-card">
      <h3 class="rd-setup-subtitle">Add player</h3>
      <form id="add-player-form" class="roster-form">
        <label class="roster-field">Name
          <input type="text" id="new-player-name" placeholder="Player name" required />
        </label>
        <label class="roster-field">Handicap index
          <input type="number" id="new-player-handicap" placeholder="e.g. 12.4" step="0.1" />
        </label>
        <label class="roster-field">Team (this year)
          <select id="new-player-team">
            <option value="">Unassigned</option>
            <option value="A">Team USA</option>
            <option value="B">Team EU</option>
          </select>
        </label>
        <div class="rd-actions">
          <button type="submit">Add player</button>
          <span class="status-msg" id="add-player-status"></span>
        </div>
      </form>
    </div>
  </section>

  <script type="module" src="js/nav.js?v=2"></script>
  <script type="module" src="js/roster.js"></script>
</body>
</html>
