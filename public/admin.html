<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B1F3A" />
  <!-- Home Screen app support (see manifest.webmanifest): lets the site
       be added to a phone's Home Screen and open full-screen like an app,
       which iPhones require before they allow push notifications. -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Cup Tracker" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" />
  <title>Admin — Ryder Cup Trip</title>
  <link rel="stylesheet" href="css/style.css?v=13" />
</head>
<body>

  <!-- Organizer tools: players and teams, and each round's pairings and
       handicap strokes. Everything below the header stays hidden until
       the admin code is entered (js/admin.js); Firestore's rules also
       refuse these saves from anyone without the code. -->
  <header class="page-header page-header-tabs">
    <p class="page-eyebrow">Organizer tools</p>
    <h1 class="page-title">Admin</h1>
    <div class="sb-tabs st-tabs ad-tabs" id="ad-tabs" role="group" aria-label="Choose a section"></div>
  </header>

  <div id="unlock"></div>
  <p class="st-note" id="ad-locked-note">Enter the admin code to manage players, teams, pairings and strokes.</p>

  <div id="ad-content" hidden></div>

  <script type="module" src="js/nav.js?v=4"></script>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
